name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.22.x, 1.23.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Tidy and check modules
        run: |
          for d in app/cli app/server app/shared; do
            cd $d
            go mod tidy
            if ! git diff --exit-code go.mod go.sum; then
              echo "Run 'go mod tidy' and commit changes in $d"
              exit 1
            fi
            cd -
          done

      - name: Build all modules
        run: |
          for d in app/cli app/server app/shared; do
            cd $d
            go build ./...
            cd -
          done

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          for d in app/cli app/server app/shared; do
            cd $d
            golangci-lint run
            cd -
          done

      - name: Format check
        run: |
          for d in app/cli app/server app/shared; do
            cd $d
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "Unformatted files in $d:"
              echo "$unformatted"
              exit 1
            fi
            cd -
          done

      - name: Test (with race detector)
        run: |
          for d in app/cli app/server app/shared; do
            cd $d
            go test -race -cover ./...
            cd -
          done

      - name: Docker build (server)
        run: |
          docker build -t gpt4cli-server ./app/server

      # Optionally, upload coverage to Codecov
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./app/cli/coverage.out,./app/server/coverage.out,./app/shared/coverage.out 